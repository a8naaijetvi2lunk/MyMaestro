[project]
name = "mymaestro"
version = "0.1.0"
description = "Studio IA local modulaire — socle + module Director musique"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn>=0.54",
    "pydantic>=2.13,<3",
    "numpy>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
