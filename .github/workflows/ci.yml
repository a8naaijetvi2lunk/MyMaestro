name: CI
on:
  push:
  pull_request:
jobs:
  verifier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Garde-fou du dépôt propre
        run: python scripts/verifier_depot_propre.py . --depot
      - uses: astral-sh/setup-uv@v10.2.0
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Serveur — dépendances
        working-directory: server
        run: uv sync --frozen
      - name: Serveur — tests
        working-directory: server
        run: uv run pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Interface — dépendances
        working-directory: ui
        run: npm ci
      - name: Interface — tests
        working-directory: ui
        run: npm run test
      - name: Interface — lint
        working-directory: ui
        run: npm run lint
      - name: Interface — build
        working-directory: ui
        run: npm run build
